name: Probar con Microsoft Defender

# Enciende Defender como en una laptop (las máquinas de GitHub lo traen apagado y con el disco
# excluido), comprueba que detecta el archivo de prueba EICAR y luego instala y usa el Toolkit
# publicado, y prueba la actualización de código y el reinicio silencioso, revisando que Defender
# no detecte nada (tests/e2e_windows_defender.py). No publica nada.

on:
  pull_request:
    paths:
      - tests/e2e_windows_defender.py
      - .github/workflows/probar-defender.yml
      - packaging/windows/build_bootloader.py
      - packaging/windows/build_windows.ps1
  workflow_dispatch:
    inputs:
      version:
        description: "Versión publicada a probar (latest: la última publicada)"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  defender:
    name: Instalar y usar el Toolkit con Defender encendido
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUBLISHED_VERSION: ${{ github.event.inputs.version || 'latest' }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Crear entorno de compilacion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt -c packaging\windows\build-constraints.txt

      - name: Encender Defender y comprobar que detecta
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py enable

      - name: Instalar y usar el Toolkit publicado
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py published $env:PUBLISHED_VERSION

      - name: Informe de Defender
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py report

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-defender
          path: |
            build/e2e-defender/*.json
            build/e2e-defender/*.log
          if-no-files-found: ignore


  actualizacion-codigo:
    name: Actualizacion de codigo y reinicio silencioso con Defender encendido
    # Solo a mano: compilar el Toolkit con Defender analizando todo el disco satura estas máquinas y
    # a veces se pierden sin dejar registro. Pasó completa el 2026-10-22 (PR #55).
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Crear entorno de compilacion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt -c packaging\windows\build-constraints.txt

      - name: Encender Defender y comprobar que detecta
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py enable

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crear una clave de prueba para firmar
        shell: pwsh
        run: |
          $secret = .\.venv\Scripts\python.exe -c "import os; print(os.urandom(32).hex())"
          $public = .\.venv\Scripts\python.exe -c "import sys; sys.path.insert(0, 'toolskit'); import update_signature as u; print(u.public_key(bytes.fromhex('$secret')).hex())"
          "UPDATE_SIGNING_KEY=$secret" >> $env:GITHUB_ENV
          "UPDATE_PUBLIC_KEY=$public" >> $env:GITHUB_ENV

      - name: Compilar e instalar con Defender encendido
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tests\e2e_windows_code_update.py base

      - name: Actualizacion de codigo con Defender encendido
        shell: pwsh
        run: |
          Add-Content -LiteralPath toolskit\app_version.py -Value "`nE2E_MARCA = 'actualizacion de codigo'"
          Set-Content -LiteralPath VERSION -Value "9.9.10"
          .\.venv\Scripts\python.exe packaging\windows\build_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe packaging\windows\sign_code_update.py build\firmado
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tests\e2e_windows_code_update.py update

      - name: Reinicio silencioso con Defender encendido
        shell: pwsh
        env:
          TOOLKIT_RESTART_IDLE_SECONDS: "20"
          TOOLKIT_RESTART_CHECK_SECONDS: "5"
          TOOLKIT_TEST_ACTIVITY_FILE: ${{ github.workspace }}\build\e2e-codigo\ocupado
        run: .\.venv\Scripts\python.exe tests\e2e_windows_code_update.py restart

      - name: Informe de Defender
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py report

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-defender-codigo
          path: |
            build/e2e-defender/*.json
            build/e2e-codigo/*.log
          if-no-files-found: ignore

  actualizar-desde-vieja:
    name: Actualizar desde la 2.3.18 con Defender encendido
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUBLISHED_VERSION: ${{ github.event.inputs.version || 'latest' }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Crear entorno
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt -c packaging\windows\build-constraints.txt

      - name: Dejar la PC como la tenia la 2.3.18 (Defender todavia apagado)
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py legacy 2.3.18

      - name: Encender Defender y comprobar que detecta
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py enable

      - name: Instalar la version publicada encima y abrirla
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py upgrade $env:PUBLISHED_VERSION

      - name: Informe de Defender
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py report

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-defender-actualizacion
          path: |
            build/e2e-defender/*.json
            build/e2e-defender/*.log
          if-no-files-found: ignore

  version-vieja:
    name: Control con la 2.3.18 y Defender encendido (solo informa)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Crear entorno
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt -c packaging\windows\build-constraints.txt

      - name: Instalar la 2.3.18 con su arranque (Defender todavia apagado)
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py legacy 2.3.18

      - name: Encender Defender y comprobar que detecta
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py enable

      - name: Abrir la 2.3.18 con Defender encendido
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py oldrun

      - name: Informe de Defender
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py report --informe

  lanzador:
    # El mismo instalador compilado aquí con el arranque de PyInstaller de serie y con el propio
    # (build_bootloader.py), los dos marcados como bajados de internet, analizados, instalados y
    # abiertos con Defender encendido. El de serie solo informa: es la comparación. El propio no debe
    # dar ninguna detección.
    name: Instalador recien compilado (arranque ${{ matrix.arranque }}) con Defender encendido
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arranque: [propio, de serie]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Crear entorno de compilacion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt -c packaging\windows\build-constraints.txt

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador (Defender todavia apagado)
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ matrix.arranque }}" -eq "de serie") { $extra += "-StockBootloader" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_windows.ps1 @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path build\bootloader\bootloader.json) { Get-Content build\bootloader\bootloader.json }

      - name: Encender Defender y comprobar que detecta
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\e2e_windows_defender.py enable

      - name: Bajar, instalar y abrir el instalador compilado
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\.venv\Scripts\python.exe tests\e2e_windows_defender.py local "dist\installer\ToolkitOGM-Setup-$version.exe" $version

      - name: Informe de Defender
        if: always()
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ matrix.arranque }}" -eq "de serie") { $extra += "--informe" }
          .\.venv\Scripts\python.exe tests\e2e_windows_defender.py report @extra

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-defender-arranque-${{ matrix.arranque == 'propio' && 'propio' || 'serie' }}
          path: |
            build/e2e-defender/*.json
            build/e2e-defender/*.log
            build/bootloader/bootloader.json
          if-no-files-found: ignore
