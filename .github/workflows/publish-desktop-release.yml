name: Publicar actualizador de escritorio

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Probar, compilar y publicar
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_REPOSITORY: jchaconv94/ToolkitSISMED
      GH_TOKEN: ${{ secrets.TOOLKITSISMED_RELEASE_TOKEN }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolskit/requirements.txt

      - name: Validar version y autorizacion
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "VERSION contiene '$version'. Use un valor como 2.0.14."
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Falta el secreto TOOLKITSISMED_RELEASE_TOKEN. Revise packaging/windows/RELEASE_AUTOMATION.md."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=desktop-v$version" >> $env:GITHUB_OUTPUT

      - name: Crear entorno de compilacion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r toolskit\requirements.txt

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Ejecutar pruebas automaticas
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Probar recuperacion del actualizador
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_update_host.ps1

      - name: Incluir la clave publica de Supabase (claves de envio)
        shell: pwsh
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          $key = "$env:SUPABASE_ANON_KEY".Trim()
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Warning "Falta el secreto SUPABASE_ANON_KEY: el Toolkit no verificara las claves de envio."
            exit 0
          }
          if ($key -notmatch '^[A-Za-z0-9._\-]+$') {
            throw "SUPABASE_ANON_KEY tiene caracteres inesperados."
          }
          Set-Content -LiteralPath toolskit/send_key_config.py -Value "SUPABASE_ANON_KEY = `"$key`"" -Encoding utf8NoBOM
          Write-Host "Clave publica de Supabase incluida."

      - name: Generar ejecutable e instalador
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_windows.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Probar actualizacion real en una instalacion aislada
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_installer_upgrade.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Verificar instalador y huella SHA-256
        id: artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.release.outputs.version }}"
          $installer = "dist\installer\ToolkitOGM-Setup-$version.exe"
          $checksum = "$installer.sha256"

          if (-not (Test-Path -LiteralPath $installer)) {
            throw "No se genero el instalador esperado: $installer"
          }
          if (-not (Test-Path -LiteralPath $checksum)) {
            throw "No se genero la huella esperada: $checksum"
          }

          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $declared) {
            throw "La huella SHA-256 del instalador no coincide."
          }

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Guardar copia del instalador en la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: ToolkitOGM-Setup-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Comprobar que la version sea nueva
        shell: pwsh
        run: |
          gh release view "${{ steps.release.outputs.tag }}" --repo "$env:TARGET_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "La Release ${{ steps.release.outputs.tag }} ya existe. Aumente VERSION antes de volver a publicar."
          }
          Write-Host "La etiqueta ${{ steps.release.outputs.tag }} esta disponible."
          exit 0

      - name: Preparar notas de la version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $commitTitle = (git log -1 --pretty=format:%s).Trim()
          @"
          ## ToolKit SISMED Desktop v$version

          Actualizacion oficial para Windows.

          - Cambio principal: $commitTitle
          - Conserva la configuracion existente durante la actualizacion.
          - El instalador incluye una huella SHA-256 para comprobar la descarga.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Crear GitHub Release publica
        shell: pwsh
        run: |
          gh release create "${{ steps.release.outputs.tag }}" `
            "${{ steps.artifacts.outputs.installer }}" `
            "${{ steps.artifacts.outputs.checksum }}" `
            --repo "$env:TARGET_REPOSITORY" `
            --target main `
            --title "ToolKit SISMED Desktop v${{ steps.release.outputs.version }}" `
            --notes-file release-notes.md `
            --latest
